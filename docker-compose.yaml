services:
  db:
    image: postgres:18.0
    restart: always
    ports:
      - "${DB_PORT}:5432"  # Puerto externo desde variable de entorno.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    container_name: FinanceDB
    volumes:
      # Desde Postgres 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker
      # y el volumen se monta en /var/lib/postgresql (no en .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: