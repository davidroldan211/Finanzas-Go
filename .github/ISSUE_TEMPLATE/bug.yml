name: Error
description: Algo no funciona como se espera.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **¿Es una vulnerabilidad de seguridad?** No la reportes aquí: sigue [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Sin datos reales ni credenciales.
      placeholder: |
        1. POST /api/v1/...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o versión
