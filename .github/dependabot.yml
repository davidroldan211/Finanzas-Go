version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencias]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    commit-message:
      prefix: ci
    labels: [dependencias, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    # Un salto mayor de Postgres exige migrar datos y actualizar el servicio
    # de Postgres en ci.yml a la vez: se hace a mano.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
    labels: [dependencias]
