name: Título del PR

# Con squash merge el título del PR se vuelve el mensaje del commit en main,
# así que debe seguir Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
            revert
            security
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            El asunto "{subject}" debe empezar en minúscula.
            Ejemplo: "feat(users): permitir registro público".
