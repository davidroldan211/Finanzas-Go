name: CI Go

on:
  push:
    branches: 
      - 'feature/**'
  pull_request:
    branches: 
      - main

env:
  GO_VERSION: '1.24'

jobs:
  build-and-lint:
    name: 🧱 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🛠️ Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🧪 Mostrar versión de Go
        run: go version

      - name: 📦 Cargar variables desde .env
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
          fi

      - name: 📥 Instalar dependencias
        run: go mod tidy

      - name:  🎨 Formatear código
        run: make fmt

      - name: 🔎 Lint (go vet)
        run: make lint

      - name: 🏗️ Compilar proyecto
        run: make build

  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v3

      - name: 🛠️ Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Cargar variables del archivo .env (si existe)
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
          fi

      - name: ✅ Ejecutar pruebas
        run: make test

      - name: 📊 Ejecutar cobertura y generar reporte
        run: |
          make coverage

  migrations:
    name: 🗃️ Migraciones
    runs-on: ubuntu-latest
    needs: build-and-lint

    services:
      postgres:
        image: postgres:14.3
        env:
          POSTGRES_DB: finanzas_ci
          POSTGRES_USER: finanzas_ci
          POSTGRES_PASSWORD: finanzas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas_ci -d finanzas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🛠️ Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📝 Generar .env para CI
        run: |
          cat > .env <<'EOF'
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=finanzas_ci
          DB_PASSWORD=finanzas_ci
          DB_NAME=finanzas_ci
          DB_SSLMODE=disable
          JWT_SECRET=ci-secret
          JWT_EXPIRES_IN=24h
          SERVER_HOST=localhost
          SERVER_PORT=8080
          APP_ENV=test
          EOF

      - name: 🔺 Aplicar migraciones (up)
        run: make migrate-up

      - name: 🔻 Revertir todas las migraciones (reset)
        run: make migrate-reset

      - name: 🔺 Re-aplicar migraciones (up)
        run: make migrate-up
